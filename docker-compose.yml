version: '3.8'

services:
  app:
    build: .
    container_name: resolveflow-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/resolveflow
      - CHECKPOINT_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/resolveflow
      - SLACK_MOCK_MODE=true
      - DISPUTE_AUTO_REFUND_THRESHOLD_AUD=100.00
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  postgres:
    image: postgres:15-alpine
    container_name: resolveflow-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resolveflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resolveflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
